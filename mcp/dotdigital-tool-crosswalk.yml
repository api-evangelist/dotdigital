method: derived
source: mcp/dotdigital-mcp-tools-list.json + openapi/ (43 harvested Dotdigital OpenAPI descriptions)
description: >-
  Crosswalk between the seven tools the Dotdigital remote MCP server exposes and the REST
  operations published in the OpenAPI descriptions. The finding here is a clean surface
  divergence, not a mapping: Dotdigital's MCP server is a META surface over the contract —
  every tool reads the specs or the documentation corpus, and NONE of them binds to a
  Dotdigital business operation. An agent can use MCP to discover how to create a contact or
  send an SMS; it cannot create a contact or send an SMS through MCP. All 522 REST operations
  are therefore rest_only.
surfaces:
