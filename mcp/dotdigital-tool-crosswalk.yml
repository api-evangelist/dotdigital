    count: 43
    location: openapi/
    catalog: https://developer.dotdigital.com/openapi
    well_known: https://developer.dotdigital.com/.well-known/api-catalog
    gated: false
  mcp:
    url: https://marketing.developer.dotdigital.com/mcp
    transport: streamable-http
    gated: false
    note: tools/list answered anonymously; input schemas captured verbatim
  graphql:
    present: false
    note: >-
      No first-party GraphQL API. Dotdigital ships GraphQL MODULES for Magento 2/Adobe Commerce
      (dotdigital-magento2-extension-graph-ql, -chat-graph-ql) which extend the merchant's own
      Magento GraphQL schema — that is the merchant's endpoint, not a Dotdigital API surface.
