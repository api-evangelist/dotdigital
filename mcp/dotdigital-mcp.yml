description: >-
  Dotdigital hosts a remote MCP server for the Marketing Developer Hub. It is a
  documentation-and-specification discovery server, not a data-plane server: the seven tools
  read the published OpenAPI descriptions and the docs corpus so a coding agent can find the
  right endpoint and write the call. Actual API calls are still made over REST with Basic auth
  API-user credentials. tools/list answered anonymously on probe (HTTP 200, SSE transport).
