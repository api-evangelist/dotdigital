apis:
- name: Dotdigital Marketing Developer Hub MCP Server
  description: >-
    A remote MCP server that exposes the Dotdigital OpenAPI corpus and the developer-hub documentation
    to AI coding tools. Seven read-only tools (list-specs, list-endpoints, get-endpoint, search-endpoints,
    get-server-variables, search, fetch). tools/list answered anonymously on probe. It is a discovery
    surface over the contract, not a data-plane API — an agent can find the right Dotdigital endpoint
    with it but cannot call the platform through it.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://marketing.developer.dotdigital.com/docs/mcp
  baseURL: https://marketing.developer.dotdigital.com/mcp
  tags:
