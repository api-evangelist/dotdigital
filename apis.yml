name: Dotdigital
description: >-
  Dotdigital is a UK-headquartered customer engagement platform (LSE: DOTD) whose Marketing
  product combines email, SMS, MMS, WhatsApp, push, app messaging, chat and web personalization
  behind one contact database. Its API estate is unusually large and unusually well published:
  42 OpenAPI descriptions are served from a public catalog at developer.dotdigital.com/openapi
  and enumerated in an RFC 9727 api-catalog linkset, spanning contacts, lists, segments,
  preferences and consent, email and SMS campaigns, transactional email, programs, pages and
  forms, insight data, ecommerce, product recommendations, scoring, and the whole CPaaS
  omnichannel messaging stack. Two frameworks run side by side — legacy v2 at /v2/* and the
  current v3 services at /<service>/v3/* built around unified contacts — and most integrations
  need both. Everything authenticates with HTTP Basic API-user credentials against a mandatory
  regional host (r1 Europe, r2 North America, r3 Asia Pacific). Dotdigital also runs a remote
  MCP server over its developer hub and publishes webhooks, a durable Events in/out API and a
  Data Firehose for streaming engagement data to cloud storage.
