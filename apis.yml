  - name: Dotdigital v3 API
    description: >-
      The current v3 REST framework, designed around unified contacts. Per-service paths
      (/contacts/v3, /insightData/v3, /events/v3, /data-firehose/v3, /configuration,
      /marketing-email) with seek pagination, a structured error envelope, and contacts
      addressable by contact id, email or mobile number. Each v3 service also serves its own
      generated description at <service>/v3/swagger.json on the API host.
