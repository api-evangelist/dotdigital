identifier_conventions:
  - >-
    v2 uses numeric surrogate ids (contact id, campaign id, address book id) and accepts email
    as an alternate selector on several contact routes.
  - >-
    v3 uses an explicit identifier TYPE (contactId | email | mobileNumber) so the same route
    serves all three; this is the headline difference of unified contacts.
  - >-
    CPaaS uses opaque GUID-shaped strings for profileId, chatId, conversationId, messageId,
    eventId and apiSpaceId.
  - >-
    Insight data is keyed by caller-chosen strings (collectionName + key), not by server ids —
    the only namespace in the estate the caller controls.
  - No id prefixes are used anywhere (unlike, say, Stripe's cus_/ch_ scheme).
