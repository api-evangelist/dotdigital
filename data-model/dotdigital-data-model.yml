description: >-
  Entity-relationship graph for the Dotdigital API estate, derived from path parameters,
  component schemas and id-reference fields across all 43 published specs. Two things dominate
  the model. First, there are effectively TWO contact models: the v2 email-contact (keyed by
  numeric contact id or email, scoped to address books) and the v3 unified contact (addressable
  by contact id, email OR phone number via an identifier type). Second, the CPaaS/messaging
  half of the estate has its own root — apiSpace — and its own person entity, Profile, which is
  explicitly NOT a Marketing contact.
