method: probed
source: live GET of /.well-known/* on every Dotdigital host named in apis.yml and in the OpenAPI servers[]
description: >-
  Well-known discovery probe across the Dotdigital website, developer hub and regional API hosts.
  Two documents are genuinely served: an RFC 9116 security.txt on the marketing site, and an
  RFC 9727 api-catalog linkset on the developer hub that enumerates all 42 published OpenAPI
  descriptions. Everything else 404s (or, on dotdigital.com, is answered with a 403 HTML block
  page by the edge, which is NOT a document).
hosts:
