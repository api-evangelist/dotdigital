    registry: packagist
    name: dotdigital/dotdigital-php
    url: https://packagist.org/packages/dotdigital/dotdigital-php
    source: https://github.com/dotmailer/dotdigital-php
    install: composer require dotdigital/dotdigital-php
    official: true
    version: 2.9.0
    published: '2026-03-20'
    note: The only first-party general-purpose REST client library. ~520k installs.
  - language: javascript
    registry: npm
    name: '@comapi/sdk-js-foundation'
    url: https://www.npmjs.com/package/@comapi/sdk-js-foundation
