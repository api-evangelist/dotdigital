    official: true
    version: 1.4.1
    published: '2026-07-02'
    note: >-
      The JavaScript App Messaging / push SDK the Dotdigital docs instruct you to install.
      Published under the legacy `@comapi` scope (Comapi was acquired by Dotdigital), not
      under a `@dotdigital` scope — a naming discontinuity a consumer has to be told about.
