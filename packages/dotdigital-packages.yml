description: >-
  Dotdigital's first-party distribution is unusual: there is ONE general-purpose server SDK
  (PHP), a set of App Messaging / push SDKs inherited from the Comapi acquisition and still
  published under the `comapi` namespace, and a large fleet of ecommerce-platform extensions
  (Adobe Commerce / Magento 2, WooCommerce, WordPress, Shopware, Shopify Hydrogen). There is no
  first-party Python, Ruby, Go, Java or .NET client for the REST API — the .NET presence is a
  samples repository, not a package. Version and published date are read from each registry's
  metadata endpoint on the generated date.
packages:
