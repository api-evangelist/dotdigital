description: >-
  Dotdigital publishes product release notes as a dated "What's new" feed on the marketing site.
  It is a genuine dated changelog, but it is a PRODUCT changelog, not an API changelog: entries
  describe platform features, not endpoint additions, breaking changes or spec version bumps.
  The developer hub has a Changelog module enabled at
  https://marketing.developer.dotdigital.com/changelog and it is EMPTY (the page's own SSR
  payload reports changelogs.total = 0, and changelog.rss returns a channel with zero items).
  API-level change is therefore only visible by diffing info.version across the 42 published
  specs, which nothing on the hub summarises.
