- code: ERROR_UNKNOWN_ACCOUNT
  description: The account is unknown. This means you are trying to reference an account that isn’t recognised. Please contact
    our support department if you require assistance.
- code: ERROR_USERACCOUNT_UNKNOWN
  description: This user account is not known. Please check the details you are using are valid.
- code: ERROR_WEAK_PASSWORD
  description: The password set for your API credentials is too weak.
