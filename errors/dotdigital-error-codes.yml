- code: ERROR_IMPORT_TOOMANYACTIVEIMPORTS
  description: You currently have more than 25 imports running at the same time.
- code: ERROR_IMPORT_UNSUPPORTED_FORMAT
  description: The import object is not in a supported format. Please ensure you use the correct format.
- code: ERROR_INVALID_APIUSEREXISTS
  description: You cannot attempt to recreate an API user which already exists.
- code: ERROR_INVALID_EMAIL
  description: The email address of the contact you are adding is invalid. Each contact object must contain a valid email
    address.
- code: ERROR_INVALID_LOGIN
  description: The username or password you are attempting to authenticate your method call with is invalid. Please make sure
    you have used the correct details. If your login attempt is still unsuccessful please follow the steps to reset your username
    and password as set out in the documentation. This error is also returned if the account you are attempting to connect
    to is turned off or disabled.
- code: ERROR_INVALID_PERSONALISATION_VALUES
  description: The personalisation values you've used aren't valid JSON strings and aren't escaped properly (especially when
    an HTML string is provided in the 'Value').
- code: ERROR_MALFORMED_REQUEST
  description: Your request is not formed correctly. Please check our documentation to make sure you have included all of
    the required parameters in your request and that it is formed correctly.
- code: ERROR_MANAGED_USER_INVALID
  description: The API managed user credentials that you have used in the request are invalid. You may have entered them incorrectly.
    Please check that the managed user credentials are being entered correctly.
- code: ERROR_MISSING_SETUPKEYVALUES
  description: You have not included all setup keys.
- code: ERROR_MULTI_FILE_UPLOAD_NOT_ALLOWED
  description: You have attempted to upload multiple files in a call, which isn’t allowed. Please upload one file per call.
- code: ERROR_NON_UNIQUE_DATAFIELD
  description: The data field you are trying to create already exists within the account you are connected to. Please either
    use the existing data field or choose a different name.
- code: ERROR_NON_UNIQUE_EMAIL
  description: The email address that you are trying to use is not unique.
- code: ERROR_NO_EMAIL_COLUMN
  description: The data file you are attempting to import does not contain an Email column. This column is required when importing
