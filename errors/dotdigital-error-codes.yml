- code: ERROR_OAUTH_TOKEN_INVALID
  description: The OAuth token being entered with the call is invalid. You may have entered it incorrectly. Please check that
    the OAuth token is being entered correctly.
- code: ERROR_PARAMETER_INVALID
  description: One of the method/operation arguments you are sending is invalid.
- code: ERROR_PREFERENCE_INVALID
  description: 'One of the preferences or preference categories is invalid. Possible reasons for this error message include
    the following: Not including private name for a preference, and assigning a preference category to another preference
    category.'
- code: ERROR_PREFERENCE_NOT_FOUND
  description: A preference or preference category with the given ID does not exist.
- code: ERROR_PROGRAM_NOT_ACTIVE
  description: You are attempting to create a program enrolment for a program that isn’t yet active. A program must be active
