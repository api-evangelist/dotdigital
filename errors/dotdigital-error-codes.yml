- code: ERROR_SMS_SENDNOTPERMITTED
  description: You do not have sufficient credit within your account for this SMS send. Please contact your account manager
    if you need more sending credits.
- code: ERROR_SURVEY_NOT_FOUND
  description: The survey you are trying to retrieve or reference in your call does not exist. Please make sure that the survey
    ID you are using is correct.
- code: ERROR_SYSTEM_SERVICETEMPORARILYUNAVAILABLE
  description: The API is temporarily down, most likely for scheduled maintenance, for which you should have received notification;
    if you did not please subscribe to our user warning list to be notified of these updates in future.
- code: ERROR_TEMPLATE_INVALID
  description: The template is not valid. This means that there is something incorrect with the template object you are sending
    to the method/operation. Check that your template object is valid by checking the definition in the documentation.
- code: ERROR_TEMPLATE_NOT_FOUND
  description: The template object could not be found within the account. Either it has been deleted or it is likely that
    you are using the incorrect ID number.
- code: ERROR_THEME_INVALID
  description: You are attempting to set up an account with an invalid theme. Please check that the theme is correct.
- code: ERROR_TRANSACTIONAL_DATA_COLLECTION_DOES_NOT_EXIST
  description: The transactional data collection you are trying to retrieve or reference in your call does not exist. Please
    make sure that the collection name you are using is correct.
- code: ERROR_TRANSACTIONAL_DATA_DOES_NOT_EXIST
  description: This piece of transactional data does not exist. Either it has been deleted or it is likely that you are using
    the incorrect collection name or key.
- code: ERROR_TRANSACTIONAL_DATA_INVALID_COLLECTION_NAME
  description: The transactional data collection name you are trying to create isn't valid. Valid transactional data collection
    names can only contain alphanumeric characters (A-Z, a-z, 0-9), dashes ( - ) and underscores ( \_ ), they can't start
    with a number and they can't exceed 255 characters in length. Please make sure that the collection name you are creating
    is valid.
- code: ERROR_TRANSACTIONAL_DATA_STORAGE_ALLOWANCE_EXCEEDED
  description: You have exceeded your transactional data storage allowance.
- code: ERROR_TRANSACTIONAL_DATA_VALIDATION_FAILED
  description: The validation of the transactional data failed. This means that there is something incorrect with the transactional
    data object you are sending to the method/operation. Check that your transactional data object is valid by checking the
    definition in the documentation.
- code: ERROR_UNKNOWN
