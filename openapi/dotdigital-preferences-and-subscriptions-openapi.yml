                      emailType: Html
                      dataFields: null
                      status: Subscribed
                    marketingPreferenceOptIns:
                    - marketingPreferenceId: 5
                      addressBookId: 1
                      isOptedIn: false
                      dateModifed: '2020-01-01 09:40:18.527000+00:00'
                    - marketingPreferenceId: 1002
                      addressBookId: 3
                      isOptedIn: false
                      dateModifed: '2020-01-01 09:40:18.527000+00:00'
                    - marketingPreferenceId: 1003
                      addressBookId: 2
                      isOptedIn: true
                      dateModifed: '2020-01-01 09:40:18.527000+00:00'
                    - marketingPreferenceId: 1004
                      addressBookId: 3
                      isOptedIn: false
                      dateModifed: '2020-01-01 09:40:18.527000+00:00'
