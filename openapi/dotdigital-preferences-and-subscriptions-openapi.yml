        example: 5a96bc79-19a7-4544-973b-e2da0c9136f9
    post:
      summary: Resubscribe contact with no challenge
      deprecated: false
      description: Resubscribes a previously unsubscribed contact without sending a challenge email
      operationId: resubscribe-contact-with-no-challenge
      tags:
      - Preferences and subscriptions
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - unsubscribedContact
              properties:
                unsubscribedContact:
                  type: object
                  description: Details of the contact to be resubscribed
                  required:
                  - email
                  properties:
                    email:
                      type: string
                      description: The email address of the contact
                    dataFields:
                      type: array
                      description: The data fields for the contact
                      items:
                        properties:
                          key:
                            type: string
                            description: The key name
                          value:
                            type: string
                            description: The value associated with the key
                        required:
                        - key
                        - value
                        type: object
            examples:
              Request Example:
                value:
                  unsubscribedContact:
                    email: john.smith@emailsim.io
                    dataFields:
                    - key: FIRSTNAME
                      value: Nelson
                    - key: LASTNAME
                      value: Redeker
                summary: Request Example
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact:
                    type: object
                    properties:
                      id:
                        type: integer
                        default: 0
                        examples:
                        - 23
                      email:
                        type: string
                        examples:
                        - john.smith@emailsim.io
                      optInType:
                        type: string
                        examples:
                        - Unknown
                      emailType:
                        type: string
                        examples:
                        - PlainText
                      dataFields: {}
                      status:
                        type: string
                        examples:
                        - Unsubscribed
                  status:
                    type: string
                    examples:
                    - ContactAdded
              examples:
                Result:
                  summary: Result
                  value:
                    contact:
                      id: 23
                      email: john.smith@emailsim.io
                      optInType: Unknown
                      emailType: PlainText
                      dataFields: null
                      status: Unsubscribed
                    status: ContactAdded
  /v2/contacts/suppressed-since/{date}:
    parameters:
    - in: header
      name: x-ddg-integration-token
      required: false
      description: If you are a partner of Dotdigital and have a [verified integration](https://developer.dotdigital.com/docs/partner-integration-verification) then include your [integration tracking token](https://developer.dotdigital.co/docs/verified-integration-tracking) here.
      schema:
        type: string
        pattern: /^(?:\{{0,1}(?:[0-9a-fA-F]){8}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){12}\}{0,1})$/
        example: 5a96bc79-19a7-4544-973b-e2da0c9136f9
    get:
      summary: Get suppressed contacts since date
      deprecated: false
      description: Gets a list of suppressed contacts after a given date along with the reason for suppression
      operationId: get-suppressed-contacts-since-date
      tags:
      - Preferences and subscriptions
      parameters:
      - name: date
        in: path
        description: The date from which any suppressed contacts are returned in [ISO 8601 format](https://www.w3.org/TR/xmlschema-2/#dateTime)
        required: true
        example: ''
        schema:
          type: string
          format: date
      - name: select
        in: query
        description: The number of records to select between 1 and 1000
        required: false
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: The numbers of records to skip in the result set
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    suppressedContact:
                      type: object
                      properties:
                        id:
                          type: integer
                          default: 0
                          examples:
                          - 25
                        email:
                          type: string
                          examples:
                          - terry.mccarthy@example.com
                        optInType:
                          type: string
                          examples:
                          - VerifiedDouble
                        emailType:
                          type: string
                          examples:
                          - Html
                        dataFields: {}
                        status:
                          type: string
                          examples:
                          - Unsubscribed
                    dateRemoved:
                      type: string
                      examples:
                      - '2020-01-01 09:40:18.527000+00:00'
                    reason:
                      type: string
                      examples:
                      - Unsubscribed
              examples:
                Result:
                  summary: Result
                  value:
                  - suppressedContact:
                      id: 25
                      email: terry.mccarthy@example.com
                      optInType: VerifiedDouble
                      emailType: Html
                      dataFields: null
                      status: Unsubscribed
                    dateRemoved: '2020-01-01 09:40:18.527000+00:00'
                    reason: Unsubscribed
                  - suppressedContact:
                      id: 38
                      email: eleanor.halloran@example.com
                      optInType: Unknown
                      emailType: PlainText
                      dataFields: null
                      status: HardBounced
                    dateRemoved: '2020-01-01 09:40:18.527000+00:00'
                    reason: HardBounced
  /v2/contacts/{email}/subscriptions:
