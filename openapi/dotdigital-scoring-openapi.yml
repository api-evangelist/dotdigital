components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    scoreInstance:
      type: object
      required:
      - contactId
      - email
      - dateModified
      - score
      - scoreLabel
      - suitability
      properties:
        contactId:
          description: The contacts unique id the score relates to.
          type: integer
          default: 0
          examples:
          - 1
        email:
          description: The email address of the contact the score relates to.
          type: string
          format: email
          examples:
          - sara.holst@example.com
        dateModified:
          description: The date and time in UTC ISO 8601 format the record was modified.
          type: string
          format: date-time
          examples:
          - '2020-01-01 09:40:18.527000+00:00'
        scoreLabel:
          description: The scores label.
          type: string
          examples:
          - Cool
        score:
          description: The score.
          type: integer
          default: 0
          examples:
          - 20
        engagement:
          description: The engagement score / level of interest.
          type: integer
          default: 0
          examples:
          - 10
        suitability:
          description: The suitability score.
          type: integer
          default: 0
          examples:
          - 30
