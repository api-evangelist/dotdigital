      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          minLength: 1
        childFolders:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ApiDocumentFolder'
    ApiFileMedia:
      type: object
      additionalProperties: false
      properties:
        fileName:
          type:
          - string
          - 'null'
        data:
