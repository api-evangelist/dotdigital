          - string
          - 'null'
        fileName:
          type:
          - string
          - 'null'
        fileSize:
          type: integer
          format: int32
        dateCreated:
          type: string
          format: date-time
        dateModified:
          type: string
          format: date-time
    ApiDocumentFolder:
      type: object
      additionalProperties: false
      required:
