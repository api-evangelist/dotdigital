    - in: header
      name: x-ddg-integration-token
      required: false
      description: If you are a partner of Dotdigital and have a [verified integration](https://developer.dotdigital.com/docs/partner-integration-verification) then include your [integration tracking token](https://developer.dotdigital.co/docs/verified-integration-tracking) here.
      schema:
        type: string
        pattern: /^(?:\{{0,1}(?:[0-9a-fA-F]){8}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){12}\}{0,1})$/
        example: 5a96bc79-19a7-4544-973b-e2da0c9136f9
    get:
      summary: Get unsubscribed from list since date
      deprecated: false
      description: Gets a list of contacts who have unsubscribed since a given date from a given list / address book
      operationId: get-unsubscribed-contacts-from-address-book-since-date
      tags:
      - Lists / Address books
      parameters:
      - name: id
        in: path
        description: The id of the list / address book
        required: true
        example: 0
        schema:
          type: integer
          format: int32
      - name: date
        in: path
        description: The date from which any unsubscribed contacts are returned in [ISO 8601 format](https://www.w3.org/TR/xmlschema-2/#dateTime)
        required: true
        example: ''
        schema:
          type: string
          format: date
      - name: select
        in: query
        description: The number of records to select between 1 and 1000
        required: false
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: The numbers of records to skip in the result set
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Result:
                  summary: Result
                  value: '[

                    {

                    "suppressedContact": {

                    "id": 1,

                    "email": "nelson.redeker@example.com",

                    "optInType": "Unknown",

                    "emailType": "PlainText",

                    "dataFields": null,

                    "status": "Unsubscribed"

                    },

                    "dateRemoved": "2020-01-01T09:40:18.527Z",

                    "reason": "Unsubscribed"

                    },

                    {

                    "suppressedContact": {

                    "id": 25,

                    "email": "terry.mccarthy@example.com",

                    "optInType": "VerifiedDouble",

                    "emailType": "Html",

                    "dataFields": null,

                    "status": "Unsubscribed"

                    },

                    "dateRemoved": "2020-01-01T09:40:18.527Z",

                    "reason": "Unsubscribed"

                    },

                    ]'
  /v2/address-books/{id}/contacts/unsubscribe:
    parameters:
    - in: header
      name: x-ddg-integration-token
      required: false
      description: If you are a partner of Dotdigital and have a [verified integration](https://developer.dotdigital.com/docs/partner-integration-verification) then include your [integration tracking token](https://developer.dotdigital.co/docs/verified-integration-tracking) here.
      schema:
        type: string
        pattern: /^(?:\{{0,1}(?:[0-9a-fA-F]){8}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){12}\}{0,1})$/
        example: 5a96bc79-19a7-4544-973b-e2da0c9136f9
    post:
      summary: Unsubscribe contact from list
      deprecated: false
      description: Unsubscribes contact from a given list / address book
      operationId: unsubscribe-contact-from-address-book
      tags:
      - Lists / Address books
      parameters:
      - name: id
        in: path
        description: The id of the list / address book
        required: true
        example: 0
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  description: The email address of the contact to be unsubscribed
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  suppressedContact:
                    type: object
                    properties:
                      id:
                        type: integer
                        default: 0
                        examples:
                        - 123456
                      email:
                        type: string
                        examples:
                        - example@emailsim.io
                      optInType:
                        type: string
                        examples:
                        - Unknown
                      emailType:
                        type: string
                        examples:
                        - Html
                      dataFields: {}
                      status:
                        type: string
                        examples:
                        - Subscribed
                  dateRemoved:
                    type: string
                    examples:
                    - '2025-07-23 11:01:55.433000+00:00'
                  reason:
                    type: string
                    examples:
                    - Unsubscribed
              examples:
                Result:
                  summary: Result
                  value:
                    suppressedContact:
                      id: 123456
                      email: example@emailsim.io
                      optInType: Unknown
                      emailType: Html
                      dataFields: null
                      status: Subscribed
                    dateRemoved: '2025-07-23 11:01:55.433000+00:00'
                    reason: Unsubscribed
  /v2/address-books/{id}/contacts/resubscribe:
    parameters:
    - in: header
      name: x-ddg-integration-token
      required: false
      description: If you are a partner of Dotdigital and have a [verified integration](https://developer.dotdigital.com/docs/partner-integration-verification) then include your [integration tracking token](https://developer.dotdigital.co/docs/verified-integration-tracking) here.
      schema:
        type: string
        pattern: /^(?:\{{0,1}(?:[0-9a-fA-F]){8}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){12}\}{0,1})$/
        example: 5a96bc79-19a7-4544-973b-e2da0c9136f9
    post:
      summary: Resubscribe contact to list
      deprecated: false
      description: Resubscribes a previously unsubscribed contact to a given list / address book
      operationId: resubscribe-contact-to-address-book
      tags:
      - Lists / Address books
      parameters:
      - name: id
        in: path
        description: The id of the list / address book
        required: true
        example: 0
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - unsubscribedContact
              properties:
                unsubscribedContact:
                  type: object
                  description: The details of the contact to be resubscribed
                  required:
                  - email
                  properties:
                    email:
                      type: string
                      description: The email address of the contact
                    dataFields:
                      type: array
                      description: The data fields for the contact
                      items:
                        properties:
                          key:
                            type: string
                            description: The key name
                          value:
                            type: string
                            description: The value associated with the key
                        required:
                        - key
                        - value
                        type: object
                preferredLocale:
                  type: string
                  description: The language code for the language you would like the resubscribe request email to be sent to the contact in
                  enum:
                  - cs-CS
                  - da-DA
                  - de-DE
                  - el-EL
                  - en-EN
                  - es-ES
                  - es
                  - fi-FI
                  - fr-FR
                  - hu-HU
                  - it-IT
                  - nl-NL
                  - nb-NO
                  - pl-PL
                  - pt-PT
                  - ru-RU
                  - se-SE
                  - sk-SK
                  - tr-TR
                  - zh-CN
                returnUrlToUseIfChallenged:
                  type: string
                  description: The URL you would like to redirect challenged contacts to after they have completed their resubscription
            examples:
              Request Example:
                value:
                  unsubscribedContact:
                    email: john.smith@emailsim.io
                    dataFields:
                    - key: FIRSTNAME
                      value: Nelson
                    - key: LASTNAME
                      value: Redeker
                  preferredLocale: de-DE
                  returnUrlToUseIfChallenged: https://www.mywebsite.com/news
                summary: Request Example
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact:
                    type: object
                    properties:
                      id:
                        type: integer
                        default: 0
                        examples:
                        - 23
                      email:
                        type: string
                        examples:
                        - john.smith@emailsim.io
                      optInType:
                        type: string
                        examples:
                        - Unknown
                      emailType:
                        type: string
                        examples:
                        - PlainText
                      dataFields: {}
                      status:
                        type: string
                        examples:
                        - Unsubscribed
                  status:
                    type: string
                    examples:
                    - ContactChallenged
              examples:
                Result:
                  summary: Result
                  value:
                    contact:
                      id: 23
                      email: john.smith@emailsim.io
                      optInType: Unknown
                      emailType: PlainText
                      dataFields: null
                      status: Unsubscribed
                    status: ContactChallenged
  /v2/address-books/{id}/contacts/resubscribe-with-no-challenge:
    parameters:
    - in: header
