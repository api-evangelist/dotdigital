openapi: 3.2.0
info:
  title: Dotdigital Cpaas API
  version: '1.0'
  description: 'Operations tagged Cpaas across 12 of this provider''s published API definitions: chat-api.json, chat-config-api.json, chat-message-api.json, chat-presence-api.json, content-api.json, conversation-api.json, conversation-message-api.json, dotdigital-message-history-openapi.yml, dotdigital-message-rules-openapi.yml, dotdigital-profile-openapi.yml, dotdigital-session-openapi.yml, dotdigital-templates-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{region}-api.dotdigital.com
  variables:
    region:
      description: The Dotdigital region id your account belongs to
      enum:
      - r1
      - r2
      - r3
      default: r1
- url: http://{region}-api.dotdigital.com/v2
  variables:
    region:
      description: The Dotdigital region id your account belongs to
      enum:
      - r1
      - r2
      - r3
      default: r1
security:
- basicAuth: []
tags:
- name: Cpaas
paths:
  /cpaas/chats/{chatId}:
    get:
      summary: Retrieves a chat
      parameters:
      - name: chatId
        in: path
        description: The id of the chat
        required: true
        schema:
          type: string
      - name: includeDeleted
        in: query
        description: Indicates whether deleted chats should be returned
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: The requested chat
          headers:
            ETag:
              description: A unique value representing the version of the chat, optionally used for optimistic concurrency control on PUT and DELETE
              schema:
                type: string
            Last-Modified:
              description: The date the chat was last updated in ISO 8601 format
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '404':
          description: The chat was not found
          content: {}
      tags:
      - Cpaas
      operationId: getCpaasChatsByChatId
      x-operation-id-source: derived
    put:
      summary: Updates a chat
      parameters:
      - name: chatId
        in: path
        description: The id of the chat
        required: true
        schema:
          type: string
      - name: if-match
        in: header
        description: An optional ETag for optimistic concurrency control
        required: false
        schema:
          type: string
      requestBody:
        description: Detail of the chat to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatUpdate'
        required: true
      responses:
        '200':
          description: The updated chat
          headers:
            ETag:
              description: A unique value representing the version of the chat, optionally used for optimistic concurrency control on PUT and DELETE
              schema:
                type: string
            Last-Modified:
              description: The date the chat was last updated in ISO 8601 format
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Validation issues were found
          content: {}
        '404':
          description: The chat was not found
          content: {}
        '409':
          description: A conncurrency issue occured updating the chat
          content: {}
        '412':
          description: The specified 'if-match' header was not valid, refresh and retry
          content: {}
      x-codegen-request-body-name: name
      tags:
      - Cpaas
      operationId: putCpaasChatsByChatId
      x-operation-id-source: derived
    delete:
      summary: Deletes a chat
      parameters:
      - name: chatId
        in: path
        description: The id of the chat
        required: true
        schema:
          type: string
      - name: if-match
        in: header
        description: An optional ETag for optimistic concurrency control
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Indicates successful deletetion of an chat
          content: {}
        '404':
          description: The chat was not found
          content: {}
        '409':
          description: A conncurrency issue occured deleting the chat
          content: {}
        '412':
          description: The specified 'if-match' header was not valid, refresh and retry
          content: {}
      tags:
      - Cpaas
      operationId: deleteCpaasChatsByChatId
      x-operation-id-source: derived
    servers:
    - url: https://{region}-api.dotdigital.com
      variables:
        region:
          description: The Dotdigital region id your account belongs to
          enum:
          - r1
          - r2
          - r3
          default: r1
