components:
  schemas:
    ChatContext:
      type: object
      properties:
        conversationId:
          type: string
          description: Optional conversationId, used to correlated messages on the channel used for the chat
    Chat:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the chat
        name:
          type: string
          description: The name of the chat
        description:
          type: string
          description: The description of the chat
        teamId:
          type: string
          description: The id of the team owning this chat
        originalTeamId:
          type: string
          description: The id of the team the chat was created against
          readOnly: true
        channelId:
          type: string
          description: The id of the channel initiating this chat
        status:
          type: string
          description: The current status of this chat
          enum:
          - new
          - replied
          - closed
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        context:
          $ref: '#/components/schemas/ChatContext'
        _createdOn:
          type: string
          description: The date (in UTC, ISO 8601 format) that the chat was created
          format: date-time
          readOnly: true
        _createdBy:
          type: string
          description: The identity that created the chat
        _updatedOn:
          type: string
          description: The date (in UTC, ISO 8601 format) that the chat was last updated
          format: date-time
          readOnly: true
        _updatedBy:
          type: string
          description: The identity that created the chat
          readOnly: true
    ChatUpdate:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The name of the chat
        description:
          type: string
          description: The description of the chat
    ChatCreate:
      required:
      - channelId
      - name
      - teamId
      type: object
      properties:
        name:
          type: string
          description: The name of the chat
        description:
          type: string
          description: The description of the chat
        teamId:
          type: string
          description: The id of the team owning this chat
        channelId:
          type: string
          description: The id of the channel initiating this chat
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        context:
          $ref: '#/components/schemas/ChatContext'
    chatId_channel_body:
      type: object
      properties:
        channelId:
          type: string
          description: Must be set to a configuration chat channel
    Participant:
      required:
      - id
      type: object
      properties:
        id:
          type: string
