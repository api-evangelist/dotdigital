  /cpaas/chats:
    get:
      summary: Retrieves a list of chats
      parameters:
      - name: profileId
        in: query
        description: Indicates whether only chats the profile is a participant of should be returned
        required: false
        schema:
          type: string
      - name: scope
        in: query
        description: The scope of the query.
        required: false
        schema:
          type: string
          enum:
          - profile
          - all
          default: profile
      - name: includeClosed
        in: query
        description: Indicates whether closed chats should be returned
        required: false
        schema:
          type: boolean
      - name: includeDeleted
        in: query
        description: Indicates whether deleted chats should be returned
        required: false
        schema:
          type: boolean
      - name: idsOnly
        in: query
        description: Indicates whether just the ids should be returned
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: A list of matching chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
      tags:
      - Cpaas
      operationId: getCpaasChats
      x-operation-id-source: derived
    post:
