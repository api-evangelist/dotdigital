  /cpaas/chats/{chatId}/events:
    get:
      summary: Retrieves a chat's events
      parameters:
      - name: chatId
        in: path
        description: The id of the chat
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: The event id to start from
        required: true
        schema:
          minimum: 0
          type: integer
      - name: limit
        in: query
        description: The number of events to read forward
        required: true
        schema:
          minimum: 0
          type: integer
