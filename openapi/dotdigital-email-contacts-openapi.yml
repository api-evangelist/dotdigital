            examples:
              Request Example:
                value:
                  contact:
                    email: john.smith@emailsim.io
                    optInType: Unknown
                    emailType: Html
                    dataFields:
                    - key: FIRSTNAME
                      value: John
                    - key: FULLNAME
                      value: John Smith
                    - key: GENDER
                      value: Male
                    - key: LASTNAME
                      value: Smith
