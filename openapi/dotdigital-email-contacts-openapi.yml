openapi: 3.1.0
info:
  title: Email contacts
  version: 2.0.1
  description: 'Deprecated v2 endpoints for managing email contacts. Use this API to create,

    retrieve, update, and delete individual contacts; bulk-import contacts from a

    JSON collection or a base64-encoded file; record consent information and

    marketing preferences; and query contacts by address-book membership, creation

    date, or modification date. All endpoints in this spec are deprecated — new

    integrations should use the v3 Contacts API instead.'
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
x-readme-fauxas: true
x-samples-languages:
- curl
- csharp
- java
- javascript
- node
- python
- php
- ruby
externalDocs:
  description: Learn more about Dotdigital APIs
  url: https://developer.dotdigital.com
servers:
- url: https://{region}-api.dotdigital.com
  variables:
    region:
      default: r1
      enum:
      - r1
      - r2
      - r3
      description: The Dotdigital region id your account belongs to
security:
- basicAuth: []
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
paths:
  /v2/contacts/deletion/{deletionRequestId}:
    parameters:
    - in: header
      name: x-ddg-integration-token
      required: false
      description: If you are a partner of Dotdigital and have a [verified integration](https://developer.dotdigital.com/docs/partner-integration-verification) then include your [integration tracking token](https://developer.dotdigital.co/docs/verified-integration-tracking) here.
      schema:
        type: string
        pattern: /^(?:\{{0,1}(?:[0-9a-fA-F]){8}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){12}\}{0,1})$/
        example: 5a96bc79-19a7-4544-973b-e2da0c9136f9
    get:
      summary: Get bulk contact deletion progress
      deprecated: true
      description: ''
      operationId: get-bulk-contact-deletion-progress
      tags:
      - Email contacts
      parameters:
      - name: deletionRequestId
        in: path
        description: The deletion request id returned from a previously called bulk contact deletion request
        required: true
        example: ''
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  Id:
                    type: string
                    examples:
                    - 9133c58f-a756-46e1-8cff-bd90c6cdfb92
                  Status:
                    type: string
                    examples:
                    - Completed
              examples:
                Result:
                  summary: Result
                  value:
                    Id: 9133c58f-a756-46e1-8cff-bd90c6cdfb92
                    Status: Completed
  /v2/contacts:
    parameters:
    - in: header
      name: x-ddg-integration-token
      required: false
      description: If you are a partner of Dotdigital and have a [verified integration](https://developer.dotdigital.com/docs/partner-integration-verification) then include your [integration tracking token](https://developer.dotdigital.co/docs/verified-integration-tracking) here.
      schema:
        type: string
        pattern: /^(?:\{{0,1}(?:[0-9a-fA-F]){8}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){4}-(?:[0-9a-fA-F]){12}\}{0,1})$/
        example: 5a96bc79-19a7-4544-973b-e2da0c9136f9
    post:
      summary: Create contact
      deprecated: true
      description: Creates or updates a contact
      operationId: create-contact
      tags:
      - Email contacts
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  description: The email address of the contact
                optInType:
                  type: string
                  description: The opt-in type of the contact
                  enum:
                  - Unknown
                  - Single
                  - Double
                  - VerifiedDouble
                emailType:
                  type: string
                  description: The email type of the contact
                  enum:
                  - PlainText
                  - Html
                dataFields:
                  type: array
                  description: Each contact data field is a key-value pair; the key is a string matching the data field name in Dotdigital
                  items:
                    properties:
                      key:
                        type: string
                        description: The key name
                      value:
                        type: string
                        description: The value associated with the key
                    required:
                    - key
                    - value
                    type: object
            examples:
              Request Example:
                value:
                  email: john.smith@emailsim.io
                  optInType: Single
                  emailType: Html
                  dataFields:
                  - key: FIRSTNAME
                    value: John
                  - key: FULLNAME
                    value: John Smith
                  - key: GENDER
                    value: Male
                  - key: LASTNAME
                    value: Smith
                  - key: POSTCODE
                    value: N5 1DP
                summary: Request Example
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    default: 0
                    examples:
                    - 100
                  email:
                    type: string
                    examples:
                    - john.smith@emailsim.io
                  optInType:
                    type: string
                    examples:
                    - Single
                  emailType:
                    type: string
                    examples:
                    - Html
                  dataFields:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          examples:
                          - FIRSTNAME
                        value:
                          type: string
                          examples:
                          - John
                  status:
                    type: string
                    examples:
                    - Subscribed
              examples:
                Result:
                  summary: Result
                  value:
                    id: 100
                    email: john.smith@emailsim.io
                    optInType: Single
                    emailType: Html
                    dataFields:
                    - key: FIRSTNAME
                      value: John
                    - key: FULLNAME
                      value: John Smith
                    - key: GENDER
                      value: Male
                    - key: LASTNAME
                      value: Smith
                    - key: LASTSUBSCRIBED
                      value: '2016-08-01 10:09:22'
                    - key: POSTCODE
                      value: N5 1DP
                    status: Subscribed
    get:
      summary: Get contacts
      deprecated: true
      description: Gets a list of all contacts in the account
      operationId: get-contacts
      tags:
      - Email contacts
      parameters:
      - name: withFullData
        in: query
        description: Can be set to 'true' to retrieve the contacts along with their full contact data fields
        required: false
        schema:
          type: boolean
          default: false
      - name: select
        in: query
        description: The number of records to select between 1 and 1000
        required: false
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: The numbers of records to skip in the result set
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      default: 0
                      examples:
                      - 2
                    email:
                      type: string
                      examples:
                      - karina.plain@example.com
                    optInType:
                      type: string
                      examples:
                      - Double
                    emailType:
                      type: string
                      examples:
                      - Html
                    dataFields: {}
                    status:
                      type: string
                      examples:
                      - Subscribed
              examples:
                Result:
                  summary: Result
                  value:
                  - id: 2
                    email: karina.plain@example.com
                    optInType: Double
                    emailType: Html
                    dataFields: null
                    status: Subscribed
                  - id: 3
                    email: erik.cryer@example.com
                    optInType: VerifiedDouble
                    emailType: Html
                    dataFields: null
                    status: Subscribed
                  - id: 5
                    email: darryl.netherland@example.com
                    optInType: Single
                    emailType: PlainText
                    dataFields: null
                    status: Subscribed
  /v2/contacts/with-consent:
