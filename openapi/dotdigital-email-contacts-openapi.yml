                      value: Mozilla/5.0 (X11; OpenBSD i386) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/36.0.1985.125 Safari/537.36
                summary: Request Example
      responses:
        '201':
          description: '201'
          content:
            application/json:
