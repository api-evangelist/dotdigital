                            description: The value associated with the key
                        required:
                        - key
                        - value
                        type: object
                consentFields:
                  type: object
                  description: The consent fields that apply to the contact
                  properties:
                    fields:
                      type: array
                      description: The fields that apply to the contact
                      items:
                        properties:
                          key:
                            type: string
                            description: The key name
                          value:
                            type: string
                            description: The value associated with the key
                        required:
                        - key
                        - value
