description: >-
  Versioning, deprecation and operational-transparency posture for the Dotdigital API estate.
  Dotdigital runs a two-framework model (v2 legacy, v3 current) and marks deprecation IN THE
  SPEC — 38 operations across four v2 specs carry deprecated: true — but publishes no written
  deprecation or sunset policy, no Sunset/Deprecation response headers, and no dated retirement
  commitments. The signal is real and machine-readable; the policy behind it is not published.
versioning:
  scheme: uri-path
  frameworks: [v2, v3]
  current: v3
  hub_version: '3.5'
  docs: https://marketing.developer.dotdigital.com/docs/getting-started-with-the-api#api-versions
  note: >-
    v2 paths are /v2/*; v3 paths are /<service>/v3/*. Individual services carry their own
    semantic version in info.version (e.g. Contacts 3.4.3, Insight data 3.3.1, Events 3.1.1).
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  in_spec_marking: true
  deprecated_operation_count: 38
  note: >-
    Deprecation is communicated only by the deprecated flag inside the OpenAPI plus prose
    guidance to "prefer v3". No retirement date, notice period, or migration deadline is
    published anywhere on the developer hub. The deprecated flat-rate limiting scheme is
    similarly described as deprecated with no end date.
deprecated_operations:
  - spec: openapi/dotdigital-email-contacts-openapi.yml
    count: 20
    examples: [get-contacts, create-contact, update-contact, delete-contact, bulk-import-contacts, get-contact-import-status]
