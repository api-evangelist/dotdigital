    successor: openapi/dotdigital-insight-data-service-openapi.yml (v3 insight data)
  - spec: openapi/dotdigital-lists-address-books-openapi.yml
    count: 4
    examples: [get-contacts-from-address-book, add-contact-to-address-book, get-modified-contacts-in-address-book-since-date]
  - spec: openapi/dotdigital-ecommerce-openapi.yml
    count: 1
